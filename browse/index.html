<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tra cứu mẫu vật — Bảo tàng Hải dương học</title>
  <meta name="description" content="Tra cứu cơ sở dữ liệu mẫu vật sinh vật biển. Tìm kiếm theo tên loài, họ, địa điểm thu mẫu và tình trạng bảo tồn.">
  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://museum-datta.vercel.app/browse/">
  <meta property="og:title" content="Tra cứu thông tin mẫu vật trưng bày - Bảo tàng Hải dương học">
  <meta property="og:description" content="Hệ thống tra cứu thông tin các mẫu vật trưng bày tại Bảo tàng Hải dương học.">
  <meta property="og:image" content="https://museum-datta.vercel.app/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="vi_VN">
  <meta property="og:site_name" content="Bảo tàng Hải dương học">
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Tra cứu thông tin mẫu vật trưng bày - Bảo tàng Hải dương học">
  <meta name="twitter:description" content="Hệ thống tra cứu thông tin các mẫu vật trưng bày tại Bảo tàng Hải dương học.">
  <meta name="twitter:image" content="https://museum-datta.vercel.app/og-image.png">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐚</text></svg>">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0a1628">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/src/style.css">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';">
  <style>
    .browse-layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: var(--sp-8);
      align-items: start;
      padding-top: var(--sp-8);
      padding-bottom: var(--sp-12);
    }
    /* SIDEBAR */
    .filter-sidebar {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: var(--sp-6);
      position: sticky;
      top: 72px;
    }
    .filter-sidebar h3 {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-secondary);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: var(--sp-4);
      padding-bottom: var(--sp-3);
      border-bottom: 1px solid var(--border-subtle);
    }
    .filter-group { margin-bottom: var(--sp-6); }
    .filter-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: var(--sp-3);
    }
    .filter-option {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      padding: 6px 0;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-secondary);
      transition: color var(--dur-fast) ease;
    }
    .filter-option:hover { color: var(--accent-light); }
    .filter-option input[type="checkbox"] {
      width: 16px; height: 16px;
      accent-color: var(--accent-primary);
      cursor: pointer;
    }
    .filter-select {
      width: 100%;
      background: var(--bg-mid);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      padding: 8px 12px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
    }
    .filter-select:focus { border-color: var(--accent-light); }
    .btn-reset {
      width: 100%;
      background: var(--bg-mid);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      padding: 8px;
      font-size: 13px;
      cursor: pointer;
      margin-top: var(--sp-4);
      transition: color var(--dur-fast) ease, border-color var(--dur-fast) ease;
    }
    .btn-reset:hover { color: var(--text-primary); border-color: var(--border-strong); }

    /* MAIN */
    .browse-main {}
    .browse-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--sp-6);
      gap: var(--sp-4);
      flex-wrap: wrap;
    }
    .result-count { font-size: 14px; color: var(--text-secondary); }
    .result-count span { color: var(--text-white); font-weight: 700; }
    .offline-status { color: #fbbf24 !important; font-size: 12px; font-weight: 600; }
    .sort-select {
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      padding: 8px 12px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
    }

    /* PAGE HEADER */
    .page-header {
      background: var(--bg-mid);
      border-bottom: 1px solid var(--border-subtle);
      padding: var(--sp-8) 0 var(--sp-6);
    }
    .page-header h1 { font-size: var(--text-2xl); margin: var(--sp-1) 0 var(--sp-4); }

    /* Mobile: sidebar as drawer */
    .mobile-filter-toggle {
      display: none;
      align-items: center;
      gap: 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
    }
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin: var(--sp-8) 0 var(--sp-4);
    }
    .page-btn {
      min-width: 44px;
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid var(--border-default);
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      color: var(--text-secondary);
      font: inherit;
      cursor: pointer;
    }
    .page-btn:hover { border-color: var(--accent-primary); color: var(--text-white); }
    .page-btn[aria-current="page"] { background: var(--accent-primary); color: var(--text-white); border-color: var(--accent-light); }
    .page-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 1024px) {
      .browse-layout { grid-template-columns: 1fr; }
      .filter-sidebar { display: none; position: fixed; top: 0; left: 0; height: 100vh; z-index: 500; overflow-y: auto; border-radius: 0; }
      .filter-sidebar.open { display: block; }
      .mobile-filter-toggle { display: flex; }
      .filter-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 499; }
      .filter-backdrop.open { display: block; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="/" class="navbar-brand">
        <img src="/logo.png" alt="Logo" class="navbar-logo">
        Bảo tàng Hải dương học
      </a>
      <div class="navbar-spacer"></div>
      <ul class="navbar-links" id="primary-navigation">
        <li><a href="/">Trang chủ</a></li>
        <li><a href="/browse/" class="active" aria-current="page">Tra cứu</a></li>
        <li><a href="/map/">Bản đồ</a></li>
      </ul>
      <button class="navbar-toggle" id="navbarToggle" type="button" aria-label="Mở menu điều hướng" aria-controls="primary-navigation" aria-expanded="false">
        <span class="material-icons">menu</span>
      </button>
    </div>
  </nav>

  <div class="page-content">
    <!-- Page header -->
    <div class="page-header">
      <div class="container">
        <span class="eyebrow">Cơ sở dữ liệu</span>
        <h1>Tra cứu mẫu vật</h1>
        <div class="search-wrap">
          <span class="material-icons">search</span>
      <label class="sr-only" for="searchInput">Tìm kiếm mẫu vật</label>
      <input type="text" class="search-input" id="searchInput"
            placeholder="Tìm theo tên loài, họ, tên Việt, địa điểm..."
            autocomplete="off">
        </div>
      </div>
    </div>

    <div class="filter-backdrop" id="filterBackdrop"></div>
    <div class="container">
      <div class="browse-layout">
        <!-- SIDEBAR -->
        <aside class="filter-sidebar" id="filterSidebar">
          <h3>Bộ lọc</h3>

          <div class="filter-group">
            <label>Nhóm mẫu</label>
            <div id="groupFilters">
              <div class="skeleton" style="height:24px;margin-bottom:8px;border-radius:4px"></div>
            </div>
          </div>

          <div class="filter-group">
            <label>Địa điểm thu mẫu</label>
            <div id="siteFilters">
              <div class="skeleton" style="height:24px;margin-bottom:8px;border-radius:4px"></div>
            </div>
          </div>

          <div class="filter-group">
            <label>Tình trạng bảo tồn</label>
            <label class="filter-option">
              <input type="checkbox" id="filterCites"> CITES
            </label>
            <label class="filter-option">
              <input type="checkbox" id="filterIucn"> IUCN
            </label>
            <label class="filter-option">
              <input type="checkbox" id="filterRedbook"> Sách Đỏ VN
            </label>
          </div>

          <div class="filter-group">
            <label>Hình ảnh</label>
              <label class="sr-only" for="filterImage">Lọc theo ảnh</label>
              <select class="filter-select" id="filterImage">
              <option value="all">Tất cả</option>
              <option value="has" selected>Có ảnh</option>
              <option value="no">Chưa có ảnh</option>
            </select>
          </div>

          <button class="btn-reset" id="resetFiltersBtn">
            <span class="material-icons" style="font-size:14px;vertical-align:middle">refresh</span>
            Xóa bộ lọc
          </button>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="browse-main">
          <div class="browse-header">
            <div style="display:flex;align-items:center;gap:var(--sp-3)">
              <button class="mobile-filter-toggle" id="openSidebarBtn" type="button" aria-controls="filterSidebar" aria-expanded="false">
                <span class="material-icons" style="font-size:18px">filter_list</span>
                Bộ lọc
              </button>
              <p class="result-count" aria-live="polite">Tìm thấy <span id="resultCount">—</span> kết quả <span id="offlineStatus" class="offline-status" hidden>(offline)</span></p>
            </div>
              <label class="sr-only" for="sortSelect">Sắp xếp kết quả</label>
              <select class="sort-select" id="sortSelect">
              <option value="created_at_desc">Mới nhất</option>
              <option value="common_name_vi_asc">Tên A→Z</option>
              <option value="species_asc">Tên khoa học A→Z</option>
              <option value="serial_number_asc">Số TT tăng dần</option>
            </select>
          </div>

          <div class="grid-3" id="specimenGrid">
            <div class="card skeleton" style="height:280px"></div>
            <div class="card skeleton" style="height:280px"></div>
            <div class="card skeleton" style="height:280px"></div>
            <div class="card skeleton" style="height:280px"></div>
            <div class="card skeleton" style="height:280px"></div>
            <div class="card skeleton" style="height:280px"></div>
          </div>
          <nav class="pagination" id="pagination" aria-label="Phân trang kết quả" hidden></nav>
        </main>
      </div>
    </div>

    <footer class="site-footer">
      <div class="container" style="text-align:center">
        <p style="font-size:12px">© 2026 Bảo tàng Hải dương học — <a href="/">Trang chủ</a> · <a href="/map/">Bản đồ</a></p>
      </div>
    </footer>
  </div>

  <script type="module">
    import { supabase } from '/src/lib/supabase.js';

    // Security: escape DB data before innerHTML
    const esc = str => !str ? '' : String(str).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const safeImageUrl = value => {
      try {
        const url = new URL(String(value), window.location.origin);
        return url.origin === window.location.origin ||
          (url.protocol === 'https:' && url.hostname.endsWith('.supabase.co'))
          ? url.href : '/no-photo.png';
      } catch { return '/no-photo.png'; }
    };

    let allGroups = [];
    let allSites = [];
    let selectedGroups = new Set();
    let selectedSites = new Set();
    let searchTimeout;
    let currentPage = 1;
    let totalResults = 0;
    let latestRequestId = 0;
    let activeRequestController = null;
    const PAGE_SIZE = 24;
    const OFFLINE_CACHE_KEY = 'museum:browse:last-v1';
    const OFFLINE_CACHE_TTL = 7 * 24 * 60 * 60 * 1000;

    function saveOfflineResults(data, count) {
      try {
        localStorage.setItem(OFFLINE_CACHE_KEY, JSON.stringify({ savedAt: Date.now(), page: currentPage, data, count }));
      } catch { /* Storage may be unavailable or full; online path remains unaffected. */ }
    }

    function readOfflineResults() {
      try {
        const cached = JSON.parse(localStorage.getItem(OFFLINE_CACHE_KEY) || 'null');
        return cached && Date.now() - cached.savedAt < OFFLINE_CACHE_TTL ? cached : null;
      } catch { return null; }
    }

    function isOfflineRequest(error) {
      if (!navigator.onLine) return true;
      const message = String(error?.message || '').toLowerCase();
      return Number(error?.status) === 0 || /failed to fetch|network|offline|load failed/.test(message);
    }

    // ── Parse URL params ──
    const urlParams = new URLSearchParams(window.location.search);
    const initQuery = urlParams.get('q') || '';
    if (initQuery) {
      document.getElementById('searchInput').value = initQuery;
    }

    // ── Load filter options ──
    async function loadFilters() {
      const [{ data: groups }, { data: sites }] = await Promise.all([
        supabase.from('specimen_groups').select('id, name').order('name'),
        supabase.from('collection_sites').select('id, name, region').order('name'),
      ]);
      allGroups = groups || [];
      allSites = sites || [];

      document.getElementById('groupFilters').innerHTML = allGroups.map(g => `
        <label class="filter-option">
          <input type="checkbox" class="filter-group-cb" value="${esc(g.id)}">
          ${esc(g.name)}
        </label>
      `).join('');

      document.getElementById('siteFilters').innerHTML = allSites.map(s => `
        <label class="filter-option">
          <input type="checkbox" class="filter-site-cb" value="${esc(s.id)}">
          ${esc(s.name)}${s.region ? ` <small style="color:var(--text-muted)">(${esc(s.region)})</small>` : ''}
        </label>
      `).join('');
    }

    // ── Load specimens ──
    async function applyFilters({ resetPage = false } = {}) {
      if (resetPage) currentPage = 1;
      const requestId = ++latestRequestId;
      activeRequestController?.abort();
      const requestController = new AbortController();
      activeRequestController = requestController;
      const q = document.getElementById('searchInput').value.trim();
      const sortVal = document.getElementById('sortSelect').value;

      // Fix: parse sort value properly - format is "field_asc" or "field_desc"
      const sortDir = sortVal.endsWith('_asc') ? 'asc' : 'desc';
      const sortField = sortVal.replace(/_asc$|_desc$/, '');

      const groupIds = [...document.querySelectorAll('.filter-group-cb:checked')].map(el => el.value);
      const siteIds  = [...document.querySelectorAll('.filter-site-cb:checked')].map(el => el.value);
      const citesOn    = document.getElementById('filterCites').checked;
      const iucnOn     = document.getElementById('filterIucn').checked;
      const redbookOn  = document.getElementById('filterRedbook').checked;

      // Show skeleton
      document.getElementById('specimenGrid').innerHTML = Array(6).fill(
        '<div class="card skeleton" style="height:280px"></div>'
      ).join('');

      // Remove Vietnamese accents for search
      function removeAccents(str) {
        return str
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/đ/g, 'd')
          .replace(/Đ/g, 'D');
      }

      let query = supabase
        .from('specimens')
        .select('specimen_code, common_name_vi, species, primary_image_url, is_cites, iucn_status, is_red_book_vn, specimen_groups(name), collection_sites(name)', { count: 'exact' })
        .order(sortField, { ascending: sortDir === 'asc' })
        .abortSignal(requestController.signal);

      if (q) {
        const cleanQ = removeAccents(q.toLowerCase());
        query = query.ilike('search_text', `%${cleanQ}%`);
      }
      if (groupIds.length) query = query.in('group_id', groupIds);
      if (siteIds.length)  query = query.in('site_id', siteIds);
      if (citesOn)   query = query.eq('is_cites', true);
      if (iucnOn)    query = query.not('iucn_status', 'is', null);
      if (redbookOn) query = query.eq('is_red_book_vn', true);

      const imgFilter = document.getElementById('filterImage').value;
      if (imgFilter === 'has') query = query.not('primary_image_url', 'is', null);
      else if (imgFilter === 'no') query = query.is('primary_image_url', null);

      const from = (currentPage - 1) * PAGE_SIZE;
      let result;
      try {
        result = await query.range(from, from + PAGE_SIZE - 1);
      } catch (requestError) {
        if (requestId !== latestRequestId || requestController.signal.aborted) return;
        console.error('Filter request failed:', requestError.message);
        return;
      }
      const { data, error, count } = result;
      if (requestId !== latestRequestId) return;
      const offlineStatus = document.getElementById('offlineStatus');
      if (error) {
        console.error('Filter query error:', error.message);
        const cached = isOfflineRequest(error) ? readOfflineResults() : null;
        if (cached) {
          currentPage = cached.page || 1;
          totalResults = cached.count || cached.data?.length || 0;
          offlineStatus.hidden = false;
          renderGrid(cached.data || []);
          renderPagination();
          return;
        }
      }
      offlineStatus.hidden = true;
      totalResults = count || 0;
      saveOfflineResults(data || [], totalResults);
      renderGrid(data || []);
      renderPagination();
    }

    function getBadges(s) {
      const b = [];
      if (s.is_cites)       b.push('<span class="badge badge-cites">CITES</span>');
      if (s.iucn_status)    b.push('<span class="badge badge-iucn">IUCN</span>');
      if (s.is_red_book_vn) b.push('<span class="badge badge-redbook">Sách Đỏ</span>');
      return b.join('');
    }

    function renderGrid(data) {
      document.getElementById('resultCount').textContent = totalResults;
      if (!data.length) {
        document.getElementById('specimenGrid').innerHTML = `
          <div class="empty-state" style="grid-column:1/-1">
            <span class="material-icons">search_off</span>
            <p>Không tìm thấy mẫu vật nào</p>
          </div>`;
        return;
      }
      document.getElementById('specimenGrid').innerHTML = data.map(s => `
        <a href="/specimen/?code=${encodeURIComponent(s.specimen_code)}" class="card card-accent" style="display:block;cursor:pointer;text-decoration:none">
          <div class="card-img">
            ${s.primary_image_url
              ? `<img src="${esc(safeImageUrl(s.primary_image_url))}" alt="${esc(s.common_name_vi || s.species)}" loading="lazy" decoding="async">`
              : `<img src="/no-photo.png" alt="Chưa có ảnh" loading="lazy" decoding="async" style="opacity:0.6">`
            }
          </div>
          <div class="card-body">
            <span class="eyebrow" style="font-size:10px">${esc(s.specimen_groups?.name || '')}</span>
            <div class="card-title">${esc(s.common_name_vi || '—')}</div>
            <div class="card-subtitle">${esc(s.species || '')}</div>
            <div class="card-meta">
              <span class="material-icons">pin_drop</span>
              ${esc(s.collection_sites?.name || '—')}
              <span class="specimen-code" style="margin-left:auto">${esc(s.specimen_code)}</span>
            </div>
            <div class="card-badges">${getBadges(s)}</div>
          </div>
        </a>
      `).join('');
    }

    function renderPagination() {
      const pagination = document.getElementById('pagination');
      const totalPages = Math.ceil(totalResults / PAGE_SIZE);
      if (totalPages <= 1) {
        pagination.hidden = true;
        pagination.innerHTML = '';
        return;
      }

      const start = Math.max(1, currentPage - 2);
      const end = Math.min(totalPages, currentPage + 2);
      const pages = [];
      for (let page = start; page <= end; page++) pages.push(page);
      pagination.hidden = false;
      pagination.innerHTML = `
        <button type="button" class="page-btn" data-page="${currentPage - 1}" ${currentPage === 1 ? 'disabled' : ''} aria-label="Trang trước">‹</button>
        ${pages.map(page => `<button type="button" class="page-btn" data-page="${page}" ${page === currentPage ? 'aria-current="page"' : ''}>${page}</button>`).join('')}
        <button type="button" class="page-btn" data-page="${currentPage + 1}" ${currentPage === totalPages ? 'disabled' : ''} aria-label="Trang sau">›</button>`;
    }

    // ── Search debounce ──
    document.getElementById('searchInput').addEventListener('input', () => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => applyFilters({ resetPage: true }), 350);
    });

    function resetFilters() {
      document.querySelectorAll('.filter-group-cb, .filter-site-cb').forEach(el => el.checked = false);
      ['filterCites','filterIucn','filterRedbook'].forEach(id => document.getElementById(id).checked = false);
      document.getElementById('filterImage').value = 'has';
      document.getElementById('searchInput').value = '';
      applyFilters({ resetPage: true });
    }
    const openSidebar = () => {
      document.getElementById('filterSidebar').classList.add('open');
      document.getElementById('filterBackdrop').classList.add('open');
    };
    const closeSidebar = () => {
      document.getElementById('filterSidebar').classList.remove('open');
      document.getElementById('filterBackdrop').classList.remove('open');
      document.getElementById('openSidebarBtn').setAttribute('aria-expanded', 'false');
    };

    document.getElementById('navbarToggle')?.addEventListener('click', () => {
      const links = document.querySelector('.navbar-links');
      const toggle = document.getElementById('navbarToggle');
      const open = links?.classList.toggle('open');
      toggle?.setAttribute('aria-expanded', String(Boolean(open)));
    });
    document.getElementById('filterBackdrop').addEventListener('click', closeSidebar);
    document.getElementById('openSidebarBtn').addEventListener('click', () => {
      openSidebar();
      document.getElementById('openSidebarBtn').setAttribute('aria-expanded', 'true');
    });
    document.getElementById('resetFiltersBtn').addEventListener('click', resetFilters);
    ['filterCites', 'filterIucn', 'filterRedbook', 'filterImage', 'sortSelect'].forEach(id => {
      document.getElementById(id).addEventListener('change', () => applyFilters({ resetPage: true }));
    });
    document.getElementById('groupFilters').addEventListener('change', () => applyFilters({ resetPage: true }));
    document.getElementById('siteFilters').addEventListener('change', () => applyFilters({ resetPage: true }));
    document.getElementById('pagination').addEventListener('click', event => {
      const button = event.target.closest('[data-page]');
      if (!button || button.disabled) return;
      currentPage = Number(button.dataset.page);
      applyFilters();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // Boot
    await loadFilters();
    applyFilters({ resetPage: true });
  </script>
  <script type="module" src="/src/pwa-ui.js"></script>
</body>
</html>
