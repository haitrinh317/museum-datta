<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06101f">
  <title>Kiểm tra Camera — Bảo tàng Hải dương học</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; background: #06101f; color: #f8fafc; }
    main { width: min(100%, 430px); text-align: center; }
    .eyebrow { color: #22d3ee; font-weight: 700; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; }
    h1 { margin: 12px 0 10px; font-size: 28px; line-height: 1.15; }
    p { color: #cbd5e1; line-height: 1.55; }
    button, a { min-height: 52px; width: 100%; border-radius: 14px; font: inherit; font-weight: 750; }
    button { margin-top: 18px; border: 0; color: #062033; background: linear-gradient(135deg, #22d3ee, #60a5fa); }
    button:active { opacity: .75; }
    a { display: grid; place-items: center; margin-top: 12px; border: 1px solid #33506a; color: #e2e8f0; text-decoration: none; }
    #status { min-height: 52px; margin: 18px 0 0; padding: 13px; border-radius: 12px; background: #10223a; color: #bae6fd; font-size: 14px; }
    video { display: none; width: 100%; margin-top: 18px; border-radius: 16px; background: #000; aspect-ratio: 3 / 4; object-fit: cover; }
    video.visible { display: block; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Chẩn đoán Safari</div>
    <h1>Kiểm tra Camera</h1>
    <p>Trang này không dùng WebAR, PWA, font ngoài hoặc nhận diện ảnh. Nó chỉ kiểm tra quyền Camera của iPhone.</p>
    <button id="camera-test" type="button">Mở Camera sau</button>
    <p id="status" role="status">JavaScript đang nạp…</p>
    <video id="preview" playsinline muted autoplay></video>
    <a href="/ar/v2?code=TB.012">Quay lại WebAR</a>
  </main>
  <script defer src="/ar-camera-test.js"></script>
</body>
</html>
