<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi tiết mẫu vật — Bảo tàng Hải dương học</title>
  <meta name="description" content="Thông tin khoa học chi tiết về mẫu vật sinh vật biển: phân loại, hình thái, sinh thái, phân bố và tình trạng bảo tồn.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐚</text></svg>">
  <link rel="stylesheet" href="/src/style.css">
  <style>
    /* ── SPECIMEN HERO ── */
    .specimen-hero {
      position: relative;
      min-height: 420px;
      display: flex;
      align-items: flex-end;
      background: var(--bg-deepest);
      overflow: hidden;
    }
    .specimen-hero-img {
      position: absolute;
      inset: 0;
      object-fit: cover;
      width: 100%;
      height: 100%;
      opacity: 0.5;
    }
    .specimen-hero-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--bg-deepest), var(--bg-mid));
    }
    .specimen-hero-placeholder .material-icons {
      font-size: 120px;
      color: rgba(8,145,178,0.15);
    }
    .specimen-hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, rgba(6,13,26,0.98) 0%, rgba(6,13,26,0.4) 60%, transparent 100%);
    }
    .specimen-hero-content {
      position: relative;
      z-index: 2;
      padding: var(--sp-8) 0;
      width: 100%;
    }
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      font-size: var(--text-sm);
      color: var(--text-secondary);
      margin-bottom: var(--sp-4);
    }
    .breadcrumb a { color: var(--text-secondary); transition: color var(--dur-fast) ease; }
    .breadcrumb a:hover { color: var(--accent-light); }
    .breadcrumb .material-icons { font-size: 14px; }
    .specimen-name { font-size: clamp(1.8rem, 4vw, 3rem); font-weight: 800; margin-bottom: var(--sp-2); }
    .specimen-sci  { font-size: clamp(1rem, 2.5vw, 1.4rem); font-style: italic; color: var(--text-accent); }
    .hero-badges { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-top: var(--sp-4); }
    .hero-code { margin-top: var(--sp-3); }

    /* ── CONTENT LAYOUT ── */
    .specimen-body {
      position: relative;
      z-index: 1;
    }
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--sp-6);
      margin-bottom: var(--sp-6);
    }
    .info-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: var(--sp-6);
    }
    .info-card h3 {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--accent-light);
      margin-bottom: var(--sp-4);
      padding-bottom: var(--sp-3);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      gap: var(--sp-2);
    }
    .info-card h3 .material-icons { font-size: 16px; }
    .info-row {
      display: flex;
      align-items: baseline;
      gap: var(--sp-3);
      padding: var(--sp-2) 0;
      border-bottom: 1px solid rgba(30,58,95,0.5);
      font-size: 14px;
    }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: var(--text-muted); min-width: 120px; flex-shrink: 0; }
    .info-value { color: var(--text-primary); font-weight: 500; }
    .info-value.sci { font-style: italic; color: var(--text-accent); }

    /* ── DESCRIPTION SECTIONS ── */
    .desc-section {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: var(--sp-6);
      margin-bottom: var(--sp-6);
    }
    .desc-section h3 {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      font-size: 16px;
      font-weight: 700;
      color: var(--text-white);
      margin-bottom: var(--sp-4);
    }
    .desc-section h3 .material-icons { color: var(--accent-light); }
    .desc-section p {
      color: var(--text-secondary);
      line-height: 1.8;
      font-size: 15px;
    }

    /* ── MAP SECTION ── */
    .location-card {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: var(--sp-6);
      align-items: start;
    }
    #specimen-map {
      height: 220px;
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--border-subtle);
    }

    /* ── STATUS BADGES ── */
    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: var(--sp-3);
    }
    .status-item {
      background: var(--bg-mid);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: var(--sp-3) var(--sp-4);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--sp-2);
      text-align: center;
    }
    .status-item .material-icons { font-size: 24px; }
    .status-item .status-label { font-size: 12px; color: var(--text-muted); }
    .status-item .status-val { font-size: 13px; font-weight: 700; }
    .status-active .material-icons { color: var(--accent-light); }
    .status-inactive .material-icons { color: var(--text-muted); opacity: 0.4; }
    .status-inactive .status-val { color: var(--text-muted); }

    /* ── BOTTOM NAV ── */
    .specimen-nav {
      position: sticky;
      bottom: 0;
      background: rgba(6,13,26,0.9);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border-subtle);
      padding: var(--sp-3) 0;
      z-index: 100;
      margin-top: var(--sp-8);
    }
    .specimen-nav .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-4);
    }

    /* ── LOADING ── */
    .page-loading {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: var(--sp-4);
    }

    @media (max-width: 768px) {
      .info-grid { grid-template-columns: 1fr; }
      .location-card { grid-template-columns: 1fr; }
      #specimen-map { height: 200px; }
      .specimen-hero { min-height: 320px; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="/" class="navbar-brand">
        <img src="/logo.png" alt="Logo" class="navbar-logo">
        Bảo tàng Hải dương học
      </a>
      <button class="navbar-toggle" onclick="document.querySelector('.navbar-links').classList.toggle('open')">☰</button>
      <div class="navbar-spacer"></div>
      <ul class="navbar-links">
        <li><a href="/">Trang chủ</a></li>
        <li><a href="/browse/">Tra cứu</a></li>
        <li><a href="/map/">Bản đồ</a></li>
      </ul>
    </div>
  </nav>

  <div class="page-content" id="pageContent">
    <div class="page-loading">
      <div style="width:40px;height:40px;border:3px solid var(--border-default);border-top-color:var(--accent-light);border-radius:50%;animation:spin 0.8s linear infinite"></div>
      <p style="color:var(--text-secondary)">Đang tải thông tin mẫu vật...</p>
    </div>
  </div>

  <script type="module">
    import { supabase } from '/src/lib/supabase.js';
    import L from 'leaflet';
    import 'leaflet/dist/leaflet.css';

    const code = new URLSearchParams(window.location.search).get('code');

    if (!code) {
      document.getElementById('pageContent').innerHTML = `
        <div class="empty-state" style="min-height:60vh">
          <span class="material-icons">error_outline</span>
          <p>Không tìm thấy mã mẫu vật</p>
          <a href="/browse/" class="btn btn-ghost" style="margin-top:16px">← Về tra cứu</a>
        </div>`;
    } else {
      loadSpecimen(code);
    }

    async function loadSpecimen(code) {
      const { data: s, error } = await supabase
        .from('specimens')
        .select('*, specimen_groups(name), collection_sites(*)')
        .eq('specimen_code', code)
        .single();

      if (error || !s) {
        document.getElementById('pageContent').innerHTML = `
          <div class="empty-state" style="min-height:60vh">
            <span class="material-icons">search_off</span>
            <p>Không tìm thấy mẫu vật: <strong>${code}</strong></p>
            <a href="/browse/" class="btn btn-ghost" style="margin-top:16px">← Về tra cứu</a>
          </div>`;
        return;
      }

      // Update page title
      document.title = `${s.common_name_vi || s.species} — Bảo tàng Hải dương học`;

      function badges(s) {
        const b = [];
        if (s.is_cites)       b.push('<span class="badge badge-cites"><span class="material-icons" style="font-size:10px">warning</span>CITES</span>');
        if (s.iucn_status)    b.push(`<span class="badge badge-iucn"><span class="material-icons" style="font-size:10px">warning</span>IUCN: ${s.iucn_status}</span>`);
        if (s.is_red_book_vn) b.push('<span class="badge badge-redbook"><span class="material-icons" style="font-size:10px">menu_book</span>Sách Đỏ VN</span>');
        return b.join('');
      }

      function infoSection(title, icon, content) {
        if (!content) return '';
        return `
          <div class="desc-section reveal">
            <h3><span class="material-icons">${icon}</span>${title}</h3>
            <p>${content.replace(/\n/g, '<br>')}</p>
          </div>`;
      }

      function statusItem(icon, label, val, active) {
        return `
          <div class="status-item ${active ? 'status-active' : 'status-inactive'}">
            <span class="material-icons">${icon}</span>
            <span class="status-val">${val || '—'}</span>
            <span class="status-label">${label}</span>
          </div>`;
      }

      const site = s.collection_sites;
      const hasMap = site?.latitude && site?.longitude;

      document.getElementById('pageContent').innerHTML = `
        <!-- HERO -->
        <section class="specimen-hero">
          ${s.primary_image_url
            ? `<img class="specimen-hero-img" src="${s.primary_image_url}" alt="${s.common_name_vi || s.species}">`
            : `<img class="specimen-hero-img" src="/no-photo.png" alt="Chưa có ảnh" style="opacity:0.5;filter:saturate(0.6)">`
          }
          <div class="specimen-hero-overlay"></div>
          <div class="container specimen-hero-content">
            <div class="breadcrumb">
              <a href="/">Trang chủ</a>
              <span class="material-icons">chevron_right</span>
              <a href="/browse/">Tra cứu</a>
              <span class="material-icons">chevron_right</span>
              <a href="/browse/?group=${encodeURIComponent(s.specimen_groups?.name||'')}">${s.specimen_groups?.name || 'Mẫu vật'}</a>
              <span class="material-icons">chevron_right</span>
              <span>${s.specimen_code}</span>
            </div>
            <h1 class="specimen-name">${s.common_name_vi || s.species || 'Mẫu vật'}</h1>
            <p class="specimen-sci">${s.species || ''}${s.author ? ` <small style="color:var(--text-muted);font-style:normal">${s.author}</small>` : ''}</p>
            <div class="hero-badges">${badges(s)}</div>
            <div class="hero-code">
              <span class="specimen-code">${s.specimen_code}</span>
              ${s.serial_number ? `<span style="color:var(--text-muted);font-size:13px;margin-left:8px">TT: ${s.serial_number}</span>` : ''}
            </div>
          </div>
        </section>

        <!-- BODY -->
        <div class="specimen-body">
          <div class="section" style="background:var(--bg-deep)">
            <div class="container">

              <!-- Taxonomy + Collection -->
              <div class="info-grid">
                <div class="info-card reveal">
                  <h3><span class="material-icons">account_tree</span>Phân loại khoa học</h3>
                  <div class="info-row"><span class="info-label">Nhóm mẫu</span><span class="info-value">${s.specimen_groups?.name || '—'}</span></div>
                  <div class="info-row"><span class="info-label">Họ (Family)</span><span class="info-value">${s.family || '—'}</span></div>
                  <div class="info-row"><span class="info-label">Loài</span><span class="info-value sci">${s.species || '—'}</span></div>
                  <div class="info-row"><span class="info-label">Tác giả mô tả</span><span class="info-value">${s.author || '—'}</span></div>
                  <div class="info-row"><span class="info-label">Tên Việt</span><span class="info-value">${s.common_name_vi || '—'}</span></div>
                </div>
                <div class="info-card reveal">
                  <h3><span class="material-icons">explore</span>Thông tin thu mẫu</h3>
                  ${site ? `
                    <div class="info-row"><span class="info-label">Địa điểm</span><span class="info-value">${site.name}</span></div>
                    <div class="info-row"><span class="info-label">Vùng biển</span><span class="info-value">${site.region || '—'}</span></div>
                    ${hasMap ? `<div class="info-row"><span class="info-label">Tọa độ</span><span class="info-value">${site.latitude.toFixed(4)}°N, ${site.longitude.toFixed(4)}°E</span></div>` : ''}
                  ` : '<div class="info-row"><span class="info-value">—</span></div>'}
                  <div class="info-row"><span class="info-label">Ngày thu</span><span class="info-value">${s.collection_date ? new Date(s.collection_date).toLocaleDateString('vi-VN') : '—'}</span></div>
                  ${hasMap ? `
                    <div id="specimen-map" style="margin-top:var(--sp-4)"></div>
                  ` : ''}
                </div>
              </div>

              <!-- Conservation status -->
              <div class="info-card reveal" style="margin-bottom:var(--sp-6)">
                <h3><span class="material-icons">shield</span>Tình trạng bảo tồn & Giá trị</h3>
                <div class="status-grid">
                  ${statusItem('warning', 'CITES', s.is_cites ? 'Có trong danh sách' : 'Không', s.is_cites)}
                  ${statusItem('warning', 'IUCN', s.iucn_status || 'Không đánh giá', !!s.iucn_status)}
                  ${statusItem('menu_book', 'Sách Đỏ VN', s.is_red_book_vn ? 'Có trong danh sách' : 'Không', s.is_red_book_vn)}
                  ${statusItem('anchor', 'Khai thác', s.is_exploited ? 'Có giá trị khai thác' : 'Không', s.is_exploited)}
                  ${statusItem('restaurant', 'Thực phẩm', s.is_food_use ? 'Được sử dụng' : 'Không', s.is_food_use)}
                </div>
              </div>

              <!-- Description sections -->
              ${infoSection('Đặc điểm hình thái, màu sắc', 'visibility', s.morphology)}
              ${infoSection('Sinh học & Sinh thái', 'eco', s.ecology)}
              ${infoSection('Phân bố', 'public', s.distribution)}
              ${infoSection('Độc tố', 'science', s.toxicity)}
              ${infoSection('Ứng dụng', 'lightbulb', s.application)}
              ${s.notes ? infoSection('Ghi chú', 'notes', s.notes) : ''}

            </div>
          </div>
        </div>

        <!-- BOTTOM NAV -->
        <nav class="specimen-nav">
          <div class="container">
            <a href="/browse/" class="btn btn-ghost btn-sm">
              <span class="material-icons">arrow_back</span>
              Danh sách
            </a>
            <button class="btn btn-ghost btn-sm" onclick="shareSpecimen()">
              <span class="material-icons">share</span>
              Chia sẻ
            </button>
          </div>
        </nav>
      `;

      // Reveal animation
      const revealObs = new IntersectionObserver(entries => {
        entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
      }, { threshold: 0.08 });
      document.querySelectorAll('.reveal').forEach(el => revealObs.observe(el));

      // Leaflet mini map (L already imported via npm)
      if (hasMap) {
        const miniMap = L.map('specimen-map', { zoomControl: true, scrollWheelZoom: true });
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
          attribution: 'Tiles &copy; Esri', maxZoom: 18,
        }).addTo(miniMap);

        // ── Overlay: Quần đảo Hoàng Sa ──
        L.circle([16.5, 112.0], {
          radius: 80000, color: '#fbbf24', weight: 1.5, dashArray: '6 4',
          fillColor: '#fbbf24', fillOpacity: 0.08, interactive: false,
        }).addTo(miniMap);
        L.marker([16.5, 112.0], {
          icon: L.divIcon({ className: '', html: '<div style="white-space:nowrap;font-size:11px;font-weight:700;color:#fbbf24;text-shadow:0 1px 4px rgba(0,0,0,0.9)">QĐ. HOÀNG SA</div>', iconAnchor: [52, 10] }),
          interactive: false,
        }).addTo(miniMap);

        // ── Overlay: Quần đảo Trường Sa ──
        L.circle([9.5, 113.5], {
          radius: 160000, color: '#38bdf8', weight: 1.5, dashArray: '6 4',
          fillColor: '#38bdf8', fillOpacity: 0.08, interactive: false,
        }).addTo(miniMap);
        L.marker([9.5, 113.5], {
          icon: L.divIcon({ className: '', html: '<div style="white-space:nowrap;font-size:11px;font-weight:700;color:#38bdf8;text-shadow:0 1px 4px rgba(0,0,0,0.9)">QĐ. TRƯỜNG SA</div>', iconAnchor: [58, 10] }),
          interactive: false,
        }).addTo(miniMap);

        // ── Marker điểm thu mẫu ──
        const marker = L.circleMarker([site.latitude, site.longitude], {
          radius: 10, fillColor: '#06b6d4', color: '#fff',
          weight: 3, opacity: 1, fillOpacity: 0.9,
        }).addTo(miniMap);
        marker.bindPopup(`<b>${site.name}</b>`).openPopup();

        // Zoom 5 để thấy cả Biển Đông + 2 quần đảo
        miniMap.setView([12.5, 113.0], 5);
      }
    }

    window.shareSpecimen = function() {
      if (navigator.share) {
        navigator.share({ title: document.title, url: window.location.href });
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert('Đã sao chép đường dẫn!');
      }
    };
  </script>
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</body>
</html>
